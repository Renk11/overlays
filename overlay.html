<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}</style>
</head>
<body>
<div id="stage"></div>
<script src="config.js" onerror="void 0"></script>
<script src="overlays.js"></script>
<script>
(function () {
  var OV = window.OV;
  OV.injectCSS();
  var st = document.getElementById('stage');
  function fit() { OV.fit(st, innerWidth, innerHeight); }
  addEventListener('resize', fit);
  function show(t, c) {
    if (!OV.TEMPLATES[t]) return;
    OV.mount(st, t, c);
    fit();
  }
  var q = new URLSearchParams(location.search);
  if (q.get('id')) {
    // Постоянная ссылка: настройки лежат в облаке и обновляются на лету
    OV.loadFirebase().then(function (fb) {
      fb.firestore().collection('overlays').doc(q.get('id')).onSnapshot(function (d) {
        if (!d.exists) return;
        var x = d.data();
        show(x.tpl, Object.assign(OV.full(x.tpl), JSON.parse(x.cfg)));
      });
    }).catch(function () {});
  } else {
    var t = q.get('t') || 'cam';
    show(t, OV.dec(t, q.get('c') || ''));
  }
})();
</script>
</body>
</html>
